# Template installed at /etc/nginx/sites-available/wishdem by install.sh, which
# substitutes __CUSTOMER_API_DOMAIN__ / __ADMIN_API_DOMAIN__ for the real domains
# you provide. This starts out as plain HTTP — run certbot afterwards (see
# DEPLOY.md) to get HTTPS; certbot's nginx plugin edits this file in place to add
# the `listen 443 ssl` blocks, certificate paths, and the http->https redirect, so
# seeing this file change after that is expected, not a mistake.

server {
	listen 80;
	listen [::]:80;
	server_name __CUSTOMER_API_DOMAIN__;

	# Nginx defaults to 1MB — this API accepts wish attachments up to 30MB
	# (see MaxAttachmentBytes in WishService.cs), so without this every real
	# photo upload gets rejected here with a 413 before it ever reaches the app.
	# Headroom above 30MB covers multipart/form-data boundary overhead.
	client_max_body_size 32M;

	location / {
		proxy_pass http://127.0.0.1:5000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	gzip on;
	gzip_types application/json;
}

server {
	listen 80;
	listen [::]:80;
	server_name __ADMIN_API_DOMAIN__;

	location / {
		proxy_pass http://127.0.0.1:5001;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	gzip on;
	gzip_types application/json;
}
